{% extends "base.html" %}

{% block content %}
<div class="content">
    <h2>Dashboard</h2>
    <p class="text-start fs-5">Track spending, filter by date/category, and visualize instantly.</p>
    <p>
        {% if messages %}
        <tr>
            <td colspan="5">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            </td>
        </tr>
        {% endif %}

    </p>
</div>
{% endblock %}
