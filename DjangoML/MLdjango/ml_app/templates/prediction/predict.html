{% extends "prediction/base.html" %}
<!-- prediction/templates/prediction/predict.html -->
{% block body %}

<div class="container">
    <h1>Upload an Image for Prediction</h1>

    <form action="{% url 'predict' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb4">
            {{ form.as_p }}
        </div>
        {{ prediction }}
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
