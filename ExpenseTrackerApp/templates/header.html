<header style="background-color: #333; color: #fff; padding: 10px; text-align: center;">
    {% if not user.is_authenticated %}
    <!-- Updated to use Bootstrap Icons (bi bi-*) -->
    <a href="/register/" class="text-white text-decoration-none mx-2">
        Sign up
    </a>
    <!--a href="{% url 'userlogin:login' %}" class="text-white text-decoration-none mx-2">
        Log in
    </a-->
    <!-- Right Side (Django POST Form styled as a link) -->
    <form method="post" action="{% url 'userlogin:login' %}" class="m-0">
        {% csrf_token %}
        <button type="submit" class="btn btn-link text-white text-decoration-none p-0">
            <i class="bi bi-box-arrow-right me-1"></i>Login
        </button>
    </form>

    {% else %}
    <!-- Flex container layout for Authenticated state -->
    <div class="d-flex justify-content-between align-items-center w-100">

        <!-- Left Side -->
        <a aria-current="page" href="{% url 'index' %}" class="text-white text-decoration-none">
            Home
        </a>

        <!-- Center Side -->
        <div><span id="welcome-message">Welcome </span>
            <h3>{{ user.username }}!</h3>

        </div>

        <!-- Right Side -->
        <!-- Right Side (Django POST Form styled as a link) -->
        <form method="post" action="{% url 'userlogin:logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-link text-white text-decoration-none p-0">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
        </form>

    </div>
    {% endif %}
</header>
<script>
    const hour = new Date().getHours();
    const greeting = hour < 12 ? "Good morning!" : hour < 18 ? "Good afternoon!" : "Good evening!";
    document.getElementById("welcome-message").textContent = greeting;

</script>
